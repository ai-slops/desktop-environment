[package]
name = "desktop-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
ui-smoke = ["dep:image"]

[dependencies]
anyhow.workspace = true
desktop-presets = { path = "../../libs/desktop-presets" }
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
windows-audio-router = { path = "../../platforms/windows-audio-router" }
windows-desktop-duplication = { path = "../../platforms/windows-desktop-duplication" }
windows-shortcuts = { path = "../../platforms/windows-shortcuts" }

[dev-dependencies]
tempfile.workspace = true
